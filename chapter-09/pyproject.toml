[project]
license = "MIT"
license-files = ["LICENSE.txt", "DISCLAIMER.md"]
name = "aic-chapter-9"
version = "1.0.0"
description = "AI Cookbook Chapter 9 complete application."
requires-python = ">=3.12"
dependencies = [
  "pypdf==6.19.0",
  "pillow==12.3.0",
  "openai==2.54.0",
  "ollama==0.6.3",
  "pydantic==2.13.5",
  "httpx[socks]==0.28.1",
]

[project.scripts]
media = "ai_cookbook.media_cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_cookbook"]
