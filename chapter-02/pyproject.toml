[project]
name = "aic-chapter-2"
version = "1.0.0"
description = "AI Cookbook Chapter 2: interpret, validate, and review repair-desk messages."
requires-python = ">=3.12"
dependencies = [
  "openai==2.54.0",
  "ollama==0.6.3",
  "pydantic==2.13.5",
  "httpx[socks]==0.28.1",
]

[project.scripts]
intake = "ai_cookbook.intake_cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_cookbook"]
