[project]
name = "aic-chapter-3"
version = "1.0.0"
description = "AI Cookbook Chapter 3: source-grounded editorial drafting and review."
requires-python = ">=3.12"
dependencies = [
  "openai==2.54.0",
  "ollama==0.6.3",
  "pydantic==2.13.5",
  "httpx[socks]==0.28.1",
]

[project.scripts]
editorial = "ai_cookbook.editorial_cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_cookbook"]
