[project]
name = "aic-chapter-10"
version = "1.0.0"
description = "AI Cookbook Chapter 10 complete application."
requires-python = ">=3.12"
dependencies = [
  "uvicorn==0.54.0",
  "fastapi==0.142.2",
  "langgraph-checkpoint-sqlite==3.1.1",
  "langgraph==1.2.12",
  "pypdf==6.19.0",
  "openai==2.54.0",
  "ollama==0.6.3",
  "pydantic==2.13.5",
  "httpx[socks]==0.28.1",
]

[project.scripts]
desk = "ai_cookbook.desk_cli:main"
knowledge = "ai_cookbook.knowledge_run:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_cookbook"]
