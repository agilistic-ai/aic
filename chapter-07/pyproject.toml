[project]
license = "MIT"
license-files = ["LICENSE.txt", "DISCLAIMER.md"]
name = "aic-chapter-7"
version = "1.0.0"
description = "AI Cookbook Chapter 7 complete application."
requires-python = ">=3.12"
dependencies = [
  "playwright==1.63.0",
  "langchain-ollama==1.1.0",
  "langchain-openai==1.6.7",
  "langchain==1.4.3",
  "openai==2.54.0",
  "ollama==0.6.3",
  "pydantic==2.13.5",
  "httpx[socks]==0.28.1",
]

[project.scripts]
research = "ai_cookbook.research_cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_cookbook"]
